<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#16181d;--mut:#6b7280;--line:#e3e6ee;--acc:#4f46e5;--accs:#e0e7ff;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--ink:#eef0f5;--mut:#9aa1b0;--line:#2a2f3a;--acc:#818cf8;--accs:#262a4d;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:18px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0}h2{font-size:24px;margin:0 0 10px}h3{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accs);color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.mut{color:var(--mut);font-size:14px}.center{text-align:center}
.big{font-size:clamp(22px,4vw,32px);font-weight:700;margin:6px 0 14px}

input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:4px 0;font:inherit}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.row.c{justify-content:center}
.opts{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.tile{position:relative;display:flex;align-items:center;gap:12px;padding:18px 16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px;font-weight:600;text-align:left;cursor:default;min-height:64px}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--acc)}.tile.click:active{transform:scale(.98)}
.tile.dim{opacity:.4}.tile.sel{border-color:var(--acc);background:var(--accs)}.tile.right{border-color:var(--ok);background:rgba(22,163,74,.16)}

.timer{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tnum{font-size:28px;font-weight:800;min-width:44px;text-align:center;color:var(--acc)}
.tbar{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.tbar i{display:block;height:100%;background:var(--acc);width:100%}
.lb .r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin:6px 0;background:var(--bg)}
.lb .r.me{background:var(--accs);outline:2px solid var(--acc)}
.lb .n{width:36px;font-weight:800;color:var(--mut)}.lb .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis}.lb .s{font-variant-numeric:tabular-nums;font-weight:700}
.rb .rbr{position:relative;display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;margin:8px 0;background:var(--bg);overflow:hidden;font-weight:600}
.rb .rbr i{position:absolute;left:0;top:0;bottom:0;background:var(--accs);transition:width .5s}
.rb .rbr span,.rb .rbr b{position:relative}
.rb .rbr.hi i{background:rgba(22,163,74,.3)}.rb .rbr.lo i{background:rgba(220,38,38,.22)}
.pod{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:10px 0 20px}
.pod div{flex:1;max-width:200px;border-radius:12px 12px 0 0;padding:14px 8px;text-align:center;color:#fff;font-weight:700}
.pod small{display:block;font-weight:500;opacity:.9}
.qc{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.orow{display:flex;gap:8px;align-items:center}.orow input[type=checkbox]{width:20px;height:20px;flex:none}
#qr{display:inline-block;padding:14px;background:#fff;border-radius:12px}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}.pl span{padding:4px 12px;border-radius:99px;background:var(--accs);color:var(--acc);font-weight:600;font-size:14px}
.good{color:var(--ok)}.bad{color:var(--bad)}
.win{background:linear-gradient(135deg,#fde68a,#fbbf24);color:#422006;border:0}

.tw{overflow-x:auto}
table.rt{width:100%;border-collapse:collapse;font-size:15px}
.rt th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.rt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt th.n,.rt td.n{text-align:center}

.rk{display:inline-block;min-width:28px;padding:2px 8px;border-radius:99px;background:var(--bg);font-weight:800;text-align:center}
.rt tr.top .rk{background:var(--ok);color:#fff}
.sh{display:flex;align-items:center;gap:8px;min-width:130px}.sh .trk{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.sh i{display:block;height:100%;background:var(--acc)}.sh span{font-size:13px;color:var(--mut);width:38px;text-align:right}
.pod2{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:14px 0}
.pod2>div{flex:1;max-width:190px;border-radius:12px 12px 0 0;padding:10px 8px;text-align:center;color:#fff;font-weight:700;word-break:break-word}
.pod2 small{display:block;font-weight:500;opacity:.95}
</style>

<script>
/* ===== YOUR FIREBASE CONFIG ===== */
const firebaseConfig = {

/* ================================ */
(function(){
var app=document.getElementById('app'),roleEl=document.getElementById('role'),outEl=document.getElementById('out'),qrb=document.getElementById('qrb');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(txt,cls,fn){var b=el('button','btn '+(cls||''),txt);b.onclick=fn;return b}
firebase.initializeApp(firebaseConfig);
var db=firebase.database(),auth=firebase.auth(),TS=firebase.database.ServerValue.TIMESTAMP;
var COL=['#e21b3c','#1368ce','#d89e00','#26890c','#8e44ad','#16a085','#d35400','#2c3e50','#c2185b','#00796b'],SH=['▲','◆','●','■','★','✚','⬟','⬢','✦','☗'];
var MI={quiz:'🧠',poll:'🗳',ranking:'📊'};
var MODES=[['quiz','🧠 Quiz'],['poll','🗳 Voting'],['ranking','📊 Ranking']];
var DESC={quiz:'Timed questions with one or more correct answers (or none). Faster correct answers score more. Ends with a leaderboard and a winner.',poll:'Everyone votes for one option, or several if you allow it. See the highest and lowest votes live.',ranking:'Everyone ranks all options from best to worst. Best rank earns the most points.'};
var quiz=null,state=null,reveal={},players={},answers={},history={},isHost=false,offset=0,revealing=false;
var playersLoaded=false,joinTried=false,confettiDone=false,histOn=false,hostTab='setup',openHist={},rkDraft={},psel={};
var wantHost=location.hash==='#host';
var draft={title:'My Event',mode:'quiz',auto:false,rs:8,questions:[newQ()]},nameDraft='',timerNum=null,timerBar=null,revNum=null,autoPause=false,advancing=false;
var qrNode=null,joinUrl=location.href.split('#')[0];
function newQ(){return{q:'',options:['','','',''],cor:[0],none:false,max:1,wt:true,time:20}}
function curMode(){return(quiz&&quiz.mode)||'quiz'}
var pid;try{pid=localStorage.getItem('pid');if(!pid){pid='p'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('pid',pid)}}catch(e){pid='p'+Math.random().toString(36).slice(2)}

/* ---------- scoring & results ---------- */
function pts(tk,limit){return Math.round(1000*(1-0.5*Math.min(1,tk/(limit*1000))))}
function parseSet(s){if(s==null||s===''||s===-1||s==='-1')return[];return String(s).split(',').filter(function(x){return x!==''}).map(Number).filter(function(n){return n>=0}).sort(function(x,y){return x-y})}
function sel(a){if(!a)return[];if(a.m!=null)return parseSet(a.m);return a.c>=0?[a.c]:[]}
function isRight(a,rv){var cs=parseSet(rv.correct);return cs.length>0&&cs.join(',')===sel(a).join(',')}
function board(){
  var by={},rows=Object.keys(players).map(function(id){var r={id:id,name:players[id].name||'?',score:0,time:0};by[id]=r;return r});
  Object.keys(reveal).forEach(function(q){var rv=reveal[q],a=answers[q]||{};
    Object.keys(a).forEach(function(id){var r=by[id];if(!r||!isRight(a[id],rv))return;
      var tk=Math.max(0,a[id].at-rv.start);r.score+=pts(tk,rv.limit);r.time+=tk})});
  rows.sort(function(a,b){return b.score-a.score||a.time-b.time});
  rows.forEach(function(r,i){r.rank=i+1});return rows;
}
function gained(q,id){var rv=reveal[q],a=(answers[q]||{})[id];return(rv&&a&&isRight(a,rv))?pts(Math.max(0,a.at-rv.start),rv.limit):0}
function remaining(){if(!state||!state.startedAt)return 0;return Math.max(0,Math.ceil((state.limit*1000-(Date.now()+offset-state.startedAt))/1000))}
function isOpen(){return !!state&&(!state.limit||remaining()>0)}
function count(q){return Object.keys(answers[q]||{}).length}
function wOf(i){return Math.max(1,5-i)}
function isW(qd){return curMode()==='poll'&&(parseInt(qd.max)||1)>1&&!!qd.wt}
function selO(a){if(!a)return[];if(a.m!=null)return String(a.m).split(',').filter(function(x){return x!==''}).map(Number).filter(function(n){return n>=0});return a.c>=0?[a.c]:[]}
function resList(qd,q){
  var n=qd.options.length,a=answers[q]||{},v=new Array(n).fill(0),p=qd.options.map(function(){return[0,0,0]}),sub=0,rk=curMode()==='ranking',w=isW(qd);
  Object.keys(a).forEach(function(id){
    var ord=rk?(a[id].r||'').split(',').filter(function(x){return x!==''}).map(Number):selO(a[id]);
    ord=ord.filter(function(oi){return oi>=0&&oi<n});if(!ord.length)return;sub++;
    ord.forEach(function(oi,pos){v[oi]+=rk?n-1-pos:w?wOf(pos):1;if(pos<3)p[oi][pos]++});
  });
  var items=qd.options.map(function(o,i){return{i:i,label:o,v:v[i],p:p[i]}});items.sort(function(x,y){return y.v-x.v});
  return{items:items,max:Math.max.apply(null,v),min:Math.min.apply(null,v),sub:sub,w:w,k:rk?3:(w?Math.min(3,Math.max(1,parseInt(qd.max)||1)):0)};
}
function winnersOf(qd,q){var R=resList(qd,q);if(!R.sub||R.max<=0)return[];return R.items.filter(function(i){return i.v===R.max}).map(function(i){return i.label})}

/* ---------- ui pieces ---------- */
function lb(rows,n,me){
  var c=el('div','lb');rows.slice(0,n).forEach(function(r){
    var d=el('div','r'+(r.id===me?' me':''));d.appendChild(el('div','n','#'+r.rank));d.appendChild(el('div','nm',r.name));d.appendChild(el('div','s',r.score+' pts'));c.appendChild(d)});
  if(!rows.length)c.appendChild(el('div','mut','No players yet.'));return c;
}
var COLNAMES='white black red orange yellow green blue purple pink brown gray grey violet indigo cyan magenta maroon navy teal gold silver lime beige turquoise lavender olive aqua coral crimson'.split(' ');
function colorOf(t){var s=String(t).trim().toLowerCase();if(COLNAMES.indexOf(s)>=0||/^#([0-9a-f]{3}|[0-9a-f]{6})$/.test(s))return s;return ''}
function tile(i,text,o){
  o=o||{};var t=el('button','tile'+(o.click?' click':'')+(o.dim?' dim':'')+(o.right?' right':'')+(o.sel?' sel':''));
  var cl=colorOf(text);
  if(cl){var sw=el('span','swatch');sw.style.background=cl;t.appendChild(sw)}else t.appendChild(el('span','shp',SH[i%SH.length]));
  t.appendChild(el('span',null,text));
  if(o.cnt!=null)t.appendChild(el('span','cnt',String(o.cnt)));
  if(o.click)t.onclick=o.click;return t;
}
function bars(items,max,sub,unit,hiMax,loMin,showCount){
  var c=el('div','rb'),mx=Math.max(max,1);
  items.forEach(function(it){
    var hi=sub&&max>0&&it.v===max,lo=sub&&it.v===loMin&&loMin!==max;
    var row=el('div','rbr'+(hi?' hi':'')+(lo?' lo':'')),bar=el('i');bar.style.width=Math.round(it.v/mx*100)+'%';
    row.appendChild(bar);row.appendChild(el('span',null,(hi?'🏆 ':lo?'🔻 ':'')+it.label));row.appendChild(el('b',null,it.v+unit));c.appendChild(row);
  });
  if(showCount)c.appendChild(el('div','mut',sub+' response'+(sub===1?'':'s')+' · 🏆 highest · 🔻 lowest'));
  return c;
}
function resBars(qd,q){var R=resList(qd,q);return bars(R.items,R.max,R.sub,(curMode()==='ranking'||R.w)?' pts':'',R.max,R.min,true)}
function timerBlock(){
  var t=el('div','timer');timerNum=el('div','tnum','');var b=el('div','tbar');timerBar=el('i');b.appendChild(timerBar);t.appendChild(timerNum);t.appendChild(b);return t;
}
function msgCard(t){var c=el('div','card center');c.appendChild(el('div','big',t));return c}
setInterval(function(){
  if(!state||state.phase!=='question'||!timerNum||!state.startedAt)return;
  if(!state.limit){timerNum.textContent='∞';timerBar.style.width='100%';return}
  var rem=remaining();timerNum.textContent=rem;
  timerBar.style.width=Math.max(0,Math.min(100,rem/state.limit*100))+'%';
  if(rem<=0&&isHost&&wantHost)doReveal();
},250);

setInterval(function(){
  if(!state||state.phase!=='reveal'||!quiz||!quiz.auto||!state.revealAt)return;
  var left=Math.max(0,Math.ceil((state.revealAt+(quiz.rs||8)*1000-(Date.now()+offset))/1000));
  if(revNum)revNum.textContent=autoPause?'Paused':'Next in '+left+'s';
  if(isHost&&wantHost&&!autoPause&&!advancing&&left<=0){advancing=true;nextQ()}
},500);
function confetti(){
  var c=document.createElement('canvas');c.style.cssText='position:fixed;left:0;top:0;pointer-events:none;z-index:50';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  var x=c.getContext('2d'),ps=[],i;
  for(i=0;i<170;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:Math.random()*4-2,vy:Math.random()*3+2,s:Math.random()*8+5,col:COL[i%COL.length],r:Math.random()*6});
  var t0=Date.now();(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(Date.now()-t0<5500)requestAnimationFrame(f);else c.remove()})();
}
function showQR(){
  var o=el('div');o.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;background:#fff;color:#111;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;text-align:center;padding:20px';
  var t=el('div','big',quiz?quiz.title:'Join');t.style.color='#111';var b=el('div');var s=Math.round(Math.min(innerWidth,innerHeight)*.6);
  try{new QRCode(b,{text:joinUrl,width:s,height:s})}catch(e){}
  var u=el('div',null,joinUrl);u.style.fontSize='20px';u.style.wordBreak='break-all';var h=el('div',null,'Tap anywhere to close');h.style.color='#666';
  o.appendChild(t);o.appendChild(b);o.appendChild(u);o.appendChild(h);o.onclick=function(){o.remove()};document.body.appendChild(o);
}
qrb.onclick=showQR;
function copyLink(b){try{navigator.clipboard.writeText(joinUrl);b.textContent='Copied ✓'}catch(e){prompt('Copy this link',joinUrl)}}
function shareLink(){
  var txt='Join: '+(quiz?quiz.title:'our event');
  if(navigator.share)navigator.share({title:txt,text:txt,url:joinUrl}).catch(function(){});
  else window.open('https://wa.me/?text='+encodeURIComponent(txt+' '+joinUrl),'_blank');
}
function downloadQR(){
  var cv=qrNode&&qrNode.querySelector('canvas');if(!cv){alert('QR not ready');return}
  var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='join-qr.png';document.body.appendChild(a);a.click();a.remove();
}

/* ---------- host actions ---------- */
function loadDraft(){
  return Promise.all([db.ref('quiz').once('value'),db.ref('keys').once('value')]).then(function(r){
    var q=r[0].val(),k=r[1].val()||[];
    if(q&&q.questions){draft.title=q.title||'My Event';draft.mode=q.mode||'quiz';draft.auto=!!q.auto;draft.rs=q.rs||8;draft.questions=q.questions.map(function(x,i){var kv=k[i];return{q:x.q,options:x.options.slice(),cor:kv==null?[0]:parseSet(kv),none:kv!=null&&parseSet(kv).length===0,max:x.max||1,wt:x.wt!=null?!!x.wt:true,time:x.time==null?20:x.time}})}
  });
}
function saveQuiz(){
  var qs=[],keys=[],mode=draft.mode;
  for(var i=0;i<draft.questions.length;i++){
    var d=draft.questions[i],opts=[],cor=[];
    d.options.forEach(function(o,oi){if(o.trim()){if(!d.none&&d.cor.indexOf(oi)>=0)cor.push(opts.length);opts.push(o.trim())}});
    if(!d.q.trim()||opts.length<2)return Promise.reject(new Error('Item '+(i+1)+': add the question text and at least 2 options.'));
    if(mode==='quiz'&&!d.none&&!cor.length)return Promise.reject(new Error('Question '+(i+1)+': tick at least one correct option, or tick “No correct answer”.'));
    var t=parseInt(d.time);if(isNaN(t))t=mode==='quiz'?20:0;
    t=mode==='quiz'?Math.max(5,Math.min(120,t)):Math.max(0,Math.min(600,t));
    if(draft.auto&&t<5)return Promise.reject(new Error('Item '+(i+1)+': Auto mode needs a time limit of at least 5 seconds.'));
    var mx=Math.max(1,Math.min(opts.length,parseInt(d.max)||1));
    if(mode==='ranking')mx=1;
    if(mode==='quiz'&&cor.length>mx)mx=cor.length;
    d.max=mx;
    var qo={q:d.q.trim(),options:opts,time:t};if(mx>1)qo.max=mx;if(mode==='poll'&&mx>1&&d.wt)qo.wt=1;
    qs.push(qo);keys.push(cor.length===0?-1:cor.length===1?cor[0]:cor.join(','));
  }
  return db.ref('quiz').set({title:draft.title.trim()||'Event',mode:mode,auto:draft.auto?1:0,rs:Math.max(3,Math.min(60,parseInt(draft.rs)||8)),questions:qs}).then(function(){return db.ref('keys').set(mode==='quiz'?keys:null)});
}
function openLobby(){
  saveQuiz().then(function(){return Promise.all([db.ref('players').remove(),db.ref('answers').remove(),db.ref('reveal').remove()])})
   .then(function(){return db.ref('state').set({phase:'lobby',mode:draft.mode})}).catch(function(e){alert(e.message)});
}
function startQ(i){if(quiz&&quiz.auto){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
  db.ref('state').set({phase:'question',qi:i,q:'q'+i,startedAt:TS,limit:quiz.questions[i].time,mode:curMode()}).catch(function(e){alert(e.message)})}
function doReveal(){
  if(revealing||!state||state.phase!=='question')return;revealing=true;
  var s=state,keyP=curMode()==='quiz'?db.ref('keys/'+s.qi).once('value').then(function(x){var v=x.val();return v==null?-1:v}):Promise.resolve(-1);
  keyP.then(function(cor){return db.ref('reveal/'+s.q).set({correct:cor,start:s.startedAt,limit:s.limit})})
   .then(function(){return db.ref('state').update({phase:'reveal',revealAt:TS})}).catch(function(e){alert(e.message)}).then(function(){revealing=false});

      var hint;
      if(m==='quiz')hint=my?(sel(my).length?'Answer locked ✓ — waiting for the results…':'Skipped — waiting for the results…'):open?(multi?'Select up to '+mx+' answers, then press Submit':'Tap your answer'):'Time’s up!';
      else hint=my?(multi?'Vote saved ✓ — change it and press Submit again until voting closes':'Vote saved ✓ — you can change it until voting closes'):open?(multi?'Select up to '+mx+' options, then press Submit':'Tap an option to vote'):'Voting closed';
      c.appendChild(el('div','mut center',hint));
      if(wtd)c.appendChild(el('div','mut center','Pick in order of preference — your 1st choice counts most.'));
    }else{
      var order=rkDraft[state.q]||parseR(my&&my.r)||[];
      qd.options.forEach(function(o,i){var pos=order.indexOf(i);
        g.appendChild(tile(i,(pos>=0?'#'+(pos+1)+'  ':'')+o,{click:open?function(){var od=order.slice();if(pos>=0)od.splice(pos,1);else od.push(i);rkDraft[state.q]=od;render(true)}:null,sel:pos>=0}))});
      c.appendChild(g);c.appendChild(el('div','mut center','Tap your favourite first, then the next… (tap again to remove)'));
      var sent=my&&my.r===order.join(',');
      var bb=el('div','row c');bb.style.marginTop='12px';
      bb.appendChild(btn(sent?'Submitted ✓':'Submit ranking','',function(){if(!open)return;if(order.length<qd.options.length){alert('Please rank all options first');return}db.ref('answers/'+state.q+'/'+pid).set({c:0,at:TS,r:order.join(',')}).catch(function(){alert('Could not send ranking')})}));
      bb.appendChild(btn('Clear','sec',function(){rkDraft[state.q]=[];render(true)}));c.appendChild(bb);
    }
    w.appendChild(c);return w;
  }
  if(state.phase==='reveal'){
    if(m!=='quiz'){
      var c5=el('div','card');c5.appendChild(el('h3',null,'Results'));c5.appendChild(el('div','big',qd.q));
      var ws=winnersOf(qd,state.q);if(ws.length)c5.appendChild(el('div','big good','🏆 '+ws.join(' & ')));
      c5.appendChild(resBars(qd,state.q));c5.appendChild(el('div','mut center','Thanks for taking part! Waiting for the host…'));w.appendChild(c5);return w;
    }
    var rv=reveal[state.q]||{correct:-1},my2=(answers[state.q]||{})[pid],gp=gained(state.q,pid),c2=el('div','card center'),cs=parseSet(rv.correct),mys=my2?sel(my2):[];
    if(!my2||!mys.length)c2.appendChild(el('div','big bad',my2?'⏭ Skipped':'⏱ No answer'));else if(!cs.length)c2.appendChild(el('div','big','No correct answer — no points'));else if(gp>0)c2.appendChild(el('div','big good','✓ Correct! +'+gp));else c2.appendChild(el('div','big bad','✗ Wrong'));
    c2.appendChild(el('div','mut',cs.length?'Correct answer: '+cs.map(function(i){return qd.options[i]}).join(', '):'This question had no correct answer.'));
    if(me)c2.appendChild(el('div','big','Rank #'+me.rank+' · '+me.score+' pts'));
    c2.appendChild(el('div','mut','Waiting for the next question…'));w.appendChild(c2);
    var c3=el('div','card');c3.appendChild(el('h3',null,'Top 5'));c3.appendChild(lb(rows,5,pid));w.appendChild(c3);return w;
  }
  if(m!=='quiz'){
    var hd=el('div','card center win');hd.appendChild(el('div','huge','🎉 Results are in!'));hd.appendChild(el('div','mut',quiz.title));w.appendChild(hd);
    w.appendChild(finalBlock(buildHist()));
    return w;
  }
  var won=me&&me.rank===1,c4=el('div','card center'+(won?' win':''));
  if(won){c4.appendChild(el('div','huge','🏆 You won! 🎉'));c4.appendChild(el('div','big',me.score+' points'))}
  else{c4.appendChild(el('h3',null,'Quiz finished'));if(rows[0])c4.appendChild(el('div','big','🎉 Winner: '+rows[0].name));if(me)c4.appendChild(el('div','big','You finished #'+me.rank+' with '+me.score+' pts'))}
  w.appendChild(c4);var c7=el('div','card');c7.appendChild(el('h3',null,'Leaderboard'));c7.appendChild(lb(rows,10,pid));w.appendChild(c7);return w;
}
function loginCard(){
  var c=el('div','card');c.appendChild(el('h3',null,'Host login'));
  var e=el('input');e.type='email';e.placeholder='Host email';var p=el('input');p.type='password';p.placeholder='Password';
  var err=el('div','mut bad');
  var go=function(){auth.signInWithEmailAndPassword(e.value.trim(),p.value).catch(function(x){err.textContent=x.message})};
  p.onkeydown=function(ev){if(ev.key==='Enter')go()};
  c.appendChild(e);c.appendChild(p);var b=btn('Sign in','',go);b.style.marginTop='8px';c.appendChild(b);c.appendChild(err);return c;
}

/* ---------- render ---------- */
function ensureJoin(){
  return;
  if((state.phase==='lobby'||state.phase==='question')&&!players[pid]){joinTried=true;db.ref('players/'+pid).set({name:'Guest'}).catch(function(){})}
}
function render(force){
  var ae=document.activeElement;
  if(!force&&ae&&ae.tagName==='INPUT'&&app.contains(ae))return;
  qrb.style.display=(isHost&&state&&state.phase)?'':'none';
  timerNum=null;timerBar=null;revNum=null;app.innerHTML='';
  if(wantHost&&!isHost){app.appendChild(loginCard());return}
  app.appendChild(wantHost?hostView():playerView());
  if(state&&state.phase==='finished'){if(!confettiDone){confettiDone=true;confetti()}}else confettiDone=false;
}
auth.onAuthStateChanged(function(u){
  isHost=!!u&&wantHost;roleEl.textContent=isHost?'Host':'Player';outEl.style.display=isHost?'':'none';
  if(isHost&&!histOn){histOn=true;db.ref('history').on('value',function(s){history=s.val()||{};render(false)},function(){})}
  if(isHost)loadDraft().then(function(){render(true)});else render(true);
});
outEl.onclick=function(){auth.signOut()};
db.ref('.info/serverTimeOffset').on('value',function(s){offset=s.val()||0});
db.ref('quiz').on('value',function(s){quiz=s.val();ensureJoin();render(false)});
db.ref('state').on('value',function(s){state=s.val();advancing=false;ensureJoin();render(true)});
db.ref('reveal').on('value',function(s){reveal=s.val()||{};render(false)});
db.ref('players').on('value',function(s){players=s.val()||{};playersLoaded=true;ensureJoin();render(false)});
db.ref('answers').on('value',function(s){
  answers=s.val()||{};render(false);
  if(isHost&&wantHost&&state&&state.phase==='question'&&curMode()==='quiz'){var np=Object.keys(players).length;if(np>0&&count(state.q)>=np)doReveal()}
});
window.addEventListener('hashchange',function(){location.reload()});
render(true);
})();
</script>
