<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Quiz</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#16181d;--mut:#6b7280;--line:#e3e6ee;--acc:#4f46e5;--accs:#e0e7ff;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--ink:#eef0f5;--mut:#9aa1b0;--line:#2a2f3a;--acc:#818cf8;--accs:#262a4d;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:18px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
h1{font-size:22px;margin:0}h2{font-size:24px;margin:0 0 10px}h3{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accs);color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.mut{color:var(--mut);font-size:14px}.center{text-align:center}
.big{font-size:clamp(22px,4vw,32px);font-weight:700;margin:6px 0 14px}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:4px 0;font:inherit}
.btn{padding:11px 20px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;font:inherit;font-weight:600}
.btn.sec{background:var(--accs);color:var(--acc)}.btn.del{background:transparent;color:var(--bad);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.opts{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.tile{position:relative;display:flex;align-items:center;gap:12px;padding:18px 16px;border:0;border-radius:12px;color:#fff;font:inherit;font-size:18px;font-weight:600;text-align:left;cursor:default;overflow:hidden;min-height:64px}
.tile.click{cursor:pointer}.tile.click:active{transform:scale(.98)}
.tile.dim{opacity:.35}.tile.right{outline:5px solid var(--ok)}
.tile .cnt{margin-left:auto;font-size:20px}
.timer{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tnum{font-size:28px;font-weight:800;min-width:44px;text-align:center;color:var(--acc)}
.tbar{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.tbar i{display:block;height:100%;background:var(--acc);width:100%}
.lb .r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin:6px 0;background:var(--bg)}
.lb .r.me{background:var(--accs);outline:2px solid var(--acc)}
.lb .n{width:32px;font-weight:800;color:var(--mut)}.lb .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis}.lb .s{font-variant-numeric:tabular-nums;font-weight:700}
.pod{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:10px 0 20px}
.pod div{flex:1;max-width:200px;border-radius:12px 12px 0 0;padding:14px 8px;text-align:center;color:#fff;font-weight:700}
.pod small{display:block;font-weight:500;opacity:.9}
.qc{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.orow{display:flex;gap:8px;align-items:center}.orow input[type=radio]{width:20px;height:20px;flex:none}
#qr{display:inline-block;padding:14px;background:#fff;border-radius:12px}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pl span{padding:4px 12px;border-radius:99px;background:var(--accs);color:var(--acc);font-weight:600;font-size:14px}
.good{color:var(--ok)}.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>🏆 Live Quiz</h1></div>
    <div class="row"><span class="badge" id="role">Player</span><button class="btn sec" id="out" style="display:none;padding:4px 12px">Sign out</button></div>
  </header>
  <div id="app"><div class="card center mut">Loading…</div></div>
</div>
<script>
/* ===== YOUR FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDrIRxeRjd7fPbr_bZ5CtsynslT7moTwUI",
  authDomain: "live-vote-427cc.firebaseapp.com",
  databaseURL: "https://live-vote-427cc-default-rtdb.firebaseio.com",
  projectId: "live-vote-427cc",
  storageBucket: "live-vote-427cc.firebasestorage.app",
  messagingSenderId: "633623933264",
  appId: "1:633623933264:web:dab65999f5e33ce366fc55"
};
/* ================================ */
(function(){
var app=document.getElementById('app'),roleEl=document.getElementById('role'),outEl=document.getElementById('out');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(txt,cls,fn){var b=el('button','btn '+(cls||''),txt);b.onclick=fn;return b}
firebase.initializeApp(firebaseConfig);
var db=firebase.database(),auth=firebase.auth(),TS=firebase.database.ServerValue.TIMESTAMP;
var COL=['#e21b3c','#1368ce','#d89e00','#26890c','#8e44ad','#16a085'],SH=['▲','◆','●','■','★','✚'];
var quiz=null,state=null,reveal={},players={},answers={},isHost=false,offset=0,revealing=false;
var wantHost=location.hash==='#host';
var draft={title:'My Quiz',questions:[newQ()]},nameDraft='',timerNum=null,timerBar=null;
var qrNode=null,joinUrl=location.href.split('#')[0];
function newQ(){return{q:'',options:['','','',''],correct:0,time:20}}
var pid;try{pid=localStorage.getItem('pid');if(!pid){pid='p'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('pid',pid)}}catch(e){pid='p'+Math.random().toString(36).slice(2)}

/* ---------- scoring ---------- */
function board(){
  var by={},rows=Object.keys(players).map(function(id){var r={id:id,name:players[id].name||'?',score:0,time:0};by[id]=r;return r});
  Object.keys(reveal).forEach(function(q){var rv=reveal[q],a=answers[q]||{};
    Object.keys(a).forEach(function(id){var r=by[id];if(!r||a[id].c!==rv.correct)return;
      var tk=Math.max(0,a[id].at-rv.start);r.score+=pts(tk,rv.limit);r.time+=tk})});
  rows.sort(function(a,b){return b.score-a.score||a.time-b.time});
  rows.forEach(function(r,i){r.rank=i+1});return rows;
}
function pts(tk,limit){return Math.round(1000*(1-0.5*Math.min(1,tk/(limit*1000))))}
function gained(q,id){var rv=reveal[q],a=(answers[q]||{})[id];return(rv&&a&&a.c===rv.correct)?pts(Math.max(0,a.at-rv.start),rv.limit):0}
function remaining(){if(!state||!state.startedAt)return 0;return Math.max(0,Math.ceil((state.limit*1000-(Date.now()+offset-state.startedAt))/1000))}
function count(q){return Object.keys(answers[q]||{}).length}

/* ---------- pieces ---------- */
function lb(rows,n,me){
  var c=el('div','lb');rows.slice(0,n).forEach(function(r){
    var d=el('div','r'+(r.id===me?' me':''));d.appendChild(el('div','n','#'+r.rank));d.appendChild(el('div','nm',r.name));d.appendChild(el('div','s',r.score+' pts'));c.appendChild(d)});
  if(!rows.length)c.appendChild(el('div','mut','No players yet.'));return c;
}
function tile(i,text,o){
  o=o||{};var t=el('button','tile'+(o.click?' click':'')+(o.dim?' dim':'')+(o.right?' right':''));t.style.background=COL[i%6];
  t.appendChild(el('span',null,SH[i%6]));t.appendChild(el('span',null,text));
  if(o.cnt!=null)t.appendChild(el('span','cnt',String(o.cnt)));
  if(o.click)t.onclick=o.click;return t;
}
function timerBlock(){
  var t=el('div','timer');timerNum=el('div','tnum','');var b=el('div','tbar');timerBar=el('i');b.appendChild(timerBar);t.appendChild(timerNum);t.appendChild(b);return t;
}
setInterval(function(){
  if(!state||state.phase!=='question'||!timerNum||!state.startedAt)return;
  var rem=remaining();timerNum.textContent=rem;
  timerBar.style.width=Math.max(0,Math.min(100,rem/state.limit*100))+'%';
  if(rem<=0&&isHost&&wantHost)doReveal();
},250);

/* ---------- host actions ---------- */
function loadDraft(){
  return Promise.all([db.ref('quiz').once('value'),db.ref('keys').once('value')]).then(function(r){
    var q=r[0].val(),k=r[1].val()||[];
    if(q&&q.questions){draft.title=q.title||'My Quiz';draft.questions=q.questions.map(function(x,i){return{q:x.q,options:x.options.slice(),correct:k[i]||0,time:x.time||20}})}
  });
}
function saveQuiz(){
  var qs=[],keys=[];
  for(var i=0;i<draft.questions.length;i++){
    var d=draft.questions[i],opts=[],cor=0;
    d.options.forEach(function(o,oi){if(o.trim()){if(oi===d.correct)cor=opts.length;opts.push(o.trim())}});
    if(!d.q.trim()||opts.length<2||!d.options[d.correct]||!d.options[d.correct].trim())return Promise.reject(new Error('Question '+(i+1)+': add question text, at least 2 options, and pick a filled correct option.'));
    qs.push({q:d.q.trim(),options:opts,time:Math.max(5,Math.min(120,parseInt(d.time)||20))});keys.push(cor);
  }
  return db.ref('quiz').set({title:draft.title.trim()||'Quiz',questions:qs}).then(function(){return db.ref('keys').set(keys)});
}
function openLobby(){
  saveQuiz().then(function(){return Promise.all([db.ref('players').remove(),db.ref('answers').remove(),db.ref('reveal').remove()])})
   .then(function(){return db.ref('state').set({phase:'lobby'})}).catch(function(e){alert(e.message)});
}
function startQ(i){db.ref('state').set({phase:'question',qi:i,q:'q'+i,startedAt:TS,limit:quiz.questions[i].time}).catch(function(e){alert(e.message)})}
function doReveal(){
  if(revealing||!state||state.phase!=='question'||!draft.questions[state.qi])return;revealing=true;
  var s=state;
  db.ref('reveal/'+s.q).set({correct:draft.questions[s.qi].correct,start:s.startedAt,limit:s.limit})
   .then(function(){return db.ref('state/phase').set('reveal')}).catch(function(e){alert(e.message)}).then(function(){revealing=false});
}
function nextQ(){if(state.qi+1<quiz.questions.length)startQ(state.qi+1);else db.ref('state/phase').set('finished')}
function resetAll(){if(confirm('End this event and go back to setup?'))Promise.all([db.ref('state').remove(),db.ref('players').remove(),db.ref('answers').remove(),db.ref('reveal').remove()])}

/* ---------- host views ---------- */
function editor(){
  var c=el('div','card');c.appendChild(el('h3',null,'Quiz setup'));
  var ti=el('input');ti.type='text';ti.placeholder='Quiz title';ti.value=draft.title;ti.oninput=function(){draft.title=ti.value};c.appendChild(ti);
  draft.questions.forEach(function(q,qi){
    var qc=el('div','qc'),h=el('div','row sp');h.appendChild(el('strong',null,'Question '+(qi+1)));
    if(draft.questions.length>1){var d=btn('Delete','del',function(){draft.questions.splice(qi,1);render(true)});h.appendChild(d)}
    qc.appendChild(h);
    var qi2=el('input');qi2.type='text';qi2.placeholder='Type your question';qi2.value=q.q;qi2.oninput=function(){q.q=qi2.value};qc.appendChild(qi2);
    qc.appendChild(el('div','mut','Choose the correct answer with the round button'));
    q.options.forEach(function(o,oi){
      var r=el('div','orow'),rd=el('input');rd.type='radio';rd.name='c'+qi;rd.checked=q.correct===oi;rd.onchange=function(){q.correct=oi};
      var oin=el('input');oin.type='text';oin.placeholder='Option '+(oi+1);oin.value=o;oin.oninput=function(){q.options[oi]=oin.value};
      r.appendChild(rd);r.appendChild(oin);qc.appendChild(r);
    });
    var f=el('div','row');f.style.marginTop='8px';
    if(q.options.length<6)f.appendChild(btn('+ Option','sec',function(){q.options.push('');render(true)}));
    var tl=el('span','mut','Time (sec):');var tn=el('input');tn.type='number';tn.min=5;tn.max=120;tn.value=q.time;tn.style.width='80px';tn.oninput=function(){q.time=tn.value};
    f.appendChild(tl);f.appendChild(tn);qc.appendChild(f);c.appendChild(qc);
  });
  var b=el('div','row');b.appendChild(btn('+ Add question','sec',function(){draft.questions.push(newQ());render(true)}));
  b.appendChild(btn('Save quiz','sec',function(){saveQuiz().then(function(){alert('Saved ✓')}).catch(function(e){alert(e.message)})}));
  b.appendChild(btn('Open lobby & show QR →','',openLobby));c.appendChild(b);return c;
}
function hostView(){
  var w=el('div');
  if(!state||!state.phase){w.appendChild(editor());return w}
  var rows=board(),n=quiz?quiz.questions.length:0;
  if(state.phase==='lobby'){
    var c=el('div','card center');c.appendChild(el('h3',null,'Scan to join'));c.appendChild(el('div','big',quiz?quiz.title:''));
    if(!qrNode){qrNode=el('div');qrNode.id='qr';try{new QRCode(qrNode,{text:joinUrl,width:260,height:260})}catch(e){}}
    c.appendChild(qrNode);var u=el('div','mut',joinUrl);u.style.marginTop='10px';u.style.wordBreak='break-all';c.appendChild(u);
    var np=Object.keys(players).length;c.appendChild(el('div','big',np+(np===1?' player':' players')+' joined'));
    var pl=el('div','pl');Object.keys(players).forEach(function(id){pl.appendChild(el('span',null,players[id].name))});c.appendChild(pl);
    var b=el('div','row');b.style.justifyContent='center';b.style.marginTop='16px';
    b.appendChild(btn('Start quiz ▶','',function(){startQ(0)}));b.appendChild(btn('Cancel','sec',resetAll));c.appendChild(b);w.appendChild(c);return w;
  }
  var qd=quiz.questions[state.qi];
  if(state.phase==='question'){
    var c2=el('div','card');c2.appendChild(el('h3',null,'Question '+(state.qi+1)+' of '+n));c2.appendChild(timerBlock());c2.appendChild(el('div','big',qd.q));
    var g=el('div','opts');qd.options.forEach(function(o,i){g.appendChild(tile(i,o))});c2.appendChild(g);
    var np2=Object.keys(players).length,ans=count(state.q);
    var f=el('div','row sp');f.style.marginTop='14px';f.appendChild(el('strong',null,ans+' / '+np2+' answered'));f.appendChild(btn('Show answer now','sec',doReveal));c2.appendChild(f);
    w.appendChild(c2);return w;
  }
  if(state.phase==='reveal'){
    var rv=reveal[state.q]||{correct:-1},a=answers[state.q]||{},cnts=qd.options.map(function(_,i){return Object.keys(a).filter(function(k){return a[k].c===i}).length});
    var c3=el('div','card');c3.appendChild(el('h3',null,'Question '+(state.qi+1)+' of '+n+' · results'));c3.appendChild(el('div','big',qd.q));
    var g2=el('div','opts');qd.options.forEach(function(o,i){g2.appendChild(tile(i,o,{cnt:cnts[i],dim:i!==rv.correct,right:i===rv.correct}))});c3.appendChild(g2);w.appendChild(c3);
    var c4=el('div','card');c4.appendChild(el('h3',null,'Top 5 so far'));c4.appendChild(lb(rows,5));
    var b2=el('div','row');b2.style.marginTop='12px';b2.appendChild(btn(state.qi+1<n?'Next question ▶':'Final results 🏆','',nextQ));c4.appendChild(b2);w.appendChild(c4);return w;
  }
  var c5=el('div','card');c5.appendChild(el('h3',null,'Final results'));c5.appendChild(el('div','big center',quiz.title));
  var pod=el('div','pod'),order=[1,0,2],h=[130,170,100],cl=['#94a3b8','#eab308','#c2763a'];
  order.forEach(function(ix){var r=rows[ix];if(!r)return;var d=el('div');d.style.height=h[ix===1?0:ix===0?1:2]+'px';d.style.background=cl[ix];d.appendChild(el('div',null,'#'+r.rank+' '+r.name));d.appendChild(el('small',null,r.score+' pts'));pod.appendChild(d)});
  c5.appendChild(pod);c5.appendChild(lb(rows,20));
  var b3=el('div','row');b3.style.marginTop='14px';b3.appendChild(btn('End event','sec',resetAll));c5.appendChild(b3);w.appendChild(c5);return w;
}

/* ---------- player views ---------- */
function joinCard(msg){
  var c=el('div','card center');c.appendChild(el('h2',null,quiz?quiz.title:'Live Quiz'));c.appendChild(el('div','mut',msg));
  var i=el('input');i.type='text';i.maxLength=20;i.placeholder='Your name';i.value=nameDraft;i.oninput=function(){nameDraft=i.value};i.style.marginTop='14px';c.appendChild(i);
  var b=btn('Join','',function(){var nm=i.value.trim();if(!nm){i.focus();return}db.ref('players/'+pid).set({name:nm}).catch(function(e){alert(e.message)})});b.style.marginTop='8px';c.appendChild(b);return c;
}
function playerView(){
  var w=el('div'),joined=!!players[pid];
  if(!state||!state.phase){w.appendChild(msgCard('Waiting for the host to open the event…'));return w}
  var rows=board(),me=rows.filter(function(r){return r.id===pid})[0],n=quiz?quiz.questions.length:0;
  if(state.phase==='lobby'){
    w.appendChild(joined?msgCard('You’re in, '+players[pid].name+'! 🎉 Waiting for the host to start…'):joinCard('Enter your name to join the quiz'));return w;
  }
  if(!joined){
    if(state.phase==='question'){w.appendChild(joinCard('Quiz in progress — join to play from the next question'));return w}
    var cc=el('div','card');cc.appendChild(el('h3',null,state.phase==='finished'?'Final results':'Leaderboard'));cc.appendChild(lb(rows,10));w.appendChild(cc);return w;
  }
  var qd=quiz.questions[state.qi];
  if(state.phase==='question'){
    var my=(answers[state.q]||{})[pid],open=!my&&remaining()>0;
    var c=el('div','card');c.appendChild(el('h3',null,'Question '+(state.qi+1)+' of '+n));c.appendChild(timerBlock());c.appendChild(el('div','big',qd.q));
    var g=el('div','opts');qd.options.forEach(function(o,i){
      g.appendChild(tile(i,o,{click:open?function(){db.ref('answers/'+state.q+'/'+pid).set({c:i,at:TS}).catch(function(e){alert('Could not send answer')})}:null,dim:!!my&&my.c!==i}))});
    c.appendChild(g);
    if(my)c.appendChild(el('div','mut center','Answer locked ✓ — waiting for the results…'));
    else if(!open)c.appendChild(el('div','mut center','Time’s up!'));
    w.appendChild(c);return w;
  }
  if(state.phase==='reveal'){
    var rv=reveal[state.q]||{correct:-1},my2=(answers[state.q]||{})[pid],gp=gained(state.q,pid);
    var c2=el('div','card center');
    if(!my2)c2.appendChild(el('div','big bad','⏱ No answer'));
    else if(gp>0)c2.appendChild(el('div','big good','✓ Correct! +'+gp));
    else c2.appendChild(el('div','big bad','✗ Wrong'));
    c2.appendChild(el('div','mut','Correct answer: '+(qd.options[rv.correct]||'')));
    if(me)c2.appendChild(el('div','big','Rank #'+me.rank+' · '+me.score+' pts'));
    c2.appendChild(el('div','mut','Waiting for the next question…'));w.appendChild(c2);
    var c3=el('div','card');c3.appendChild(el('h3',null,'Top 5'));c3.appendChild(lb(rows,5,pid));w.appendChild(c3);return w;
  }
  var c4=el('div','card center');c4.appendChild(el('h3',null,'Quiz finished'));
  if(me)c4.appendChild(el('div','big',(me.rank<=3?['🥇','🥈','🥉'][me.rank-1]+' ':'')+'You finished #'+me.rank+' with '+me.score+' pts'));w.appendChild(c4);
  var c5=el('div','card');c5.appendChild(el('h3',null,'Leaderboard'));c5.appendChild(lb(rows,10,pid));w.appendChild(c5);return w;
}
function msgCard(t){var c=el('div','card center');c.appendChild(el('div','big',t));return c}
function loginCard(){
  var c=el('div','card');c.appendChild(el('h3',null,'Host login'));
  var e=el('input');e.type='email';e.placeholder='Host email';var p=el('input');p.type='password';p.placeholder='Password';
  var err=el('div','mut bad');
  var go=function(){auth.signInWithEmailAndPassword(e.value.trim(),p.value).catch(function(x){err.textContent=x.message})};
  p.onkeydown=function(ev){if(ev.key==='Enter')go()};
  c.appendChild(e);c.appendChild(p);var b=btn('Sign in','',go);b.style.marginTop='8px';c.appendChild(b);c.appendChild(err);return c;
}

/* ---------- render ---------- */
function render(force){
  var ae=document.activeElement;
  if(!force&&ae&&ae.tagName==='INPUT'&&app.contains(ae))return;
  timerNum=null;timerBar=null;app.innerHTML='';
  if(wantHost&&!isHost){app.appendChild(loginCard());return}
  app.appendChild(wantHost?hostView():playerView());
}
auth.onAuthStateChanged(function(u){
  isHost=!!u&&wantHost;roleEl.textContent=isHost?'Host':'Player';outEl.style.display=isHost?'':'none';
  if(isHost)loadDraft().then(function(){render(true)});else render(true);
});
outEl.onclick=function(){auth.signOut()};
db.ref('.info/serverTimeOffset').on('value',function(s){offset=s.val()||0});
db.ref('quiz').on('value',function(s){quiz=s.val();render(false)});
db.ref('state').on('value',function(s){state=s.val();render(true)});
db.ref('reveal').on('value',function(s){reveal=s.val()||{};render(false)});
db.ref('players').on('value',function(s){players=s.val()||{};render(false)});
db.ref('answers').on('value',function(s){
  answers=s.val()||{};render(false);
  if(isHost&&wantHost&&state&&state.phase==='question'){var np=Object.keys(players).length;if(np>0&&count(state.q)>=np)doReveal()}
});
window.addEventListener('hashchange',function(){location.reload()});
render(true);
})();
</script>
</body>
</html>
